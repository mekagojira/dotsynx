name: Release dotsynx

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go (Latest Stable)
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Set up Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package.json"

      - name: Build React Webview
        run: |
          cd web
          npm ci
          npm run build

      - name: Extract Tag Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_NAME="${{ github.event.inputs.version }}"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile Binaries
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          echo "Building dotsynx release ${VERSION}..."

          rm -rf dist/bin dist/archives
          mkdir -p dist/bin/darwin-arm64 dist/bin/darwin-amd64 dist/bin/darwin-universal dist/bin/linux-amd64 dist/bin/linux-arm64 dist/archives

          # 1. macOS ARM64
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/bin/darwin-arm64/dotsynx ./cmd/dotsynx
          # 2. macOS AMD64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/bin/darwin-amd64/dotsynx ./cmd/dotsynx
          # 3. macOS Universal (ARM64 + AMD64 combined with lipo)
          lipo -create -output dist/bin/darwin-universal/dotsynx dist/bin/darwin-amd64/dotsynx dist/bin/darwin-arm64/dotsynx
          codesign -s - -f dist/bin/darwin-universal/dotsynx
          tar -czvf "dist/archives/dotsynx-${VERSION}-darwin-universal.tar.gz" -C dist/bin/darwin-universal dotsynx

          # 4. Linux AMD64 (x86_64)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/bin/linux-amd64/dotsynx ./cmd/dotsynx
          tar -czvf "dist/archives/dotsynx-${VERSION}-linux-amd64.tar.gz" -C dist/bin/linux-amd64 dotsynx

          # 5. Linux ARM64 (aarch64)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=${VERSION}" -o dist/bin/linux-arm64/dotsynx ./cmd/dotsynx
          tar -czvf "dist/archives/dotsynx-${VERSION}-linux-arm64.tar.gz" -C dist/bin/linux-arm64 dotsynx

      - name: Generate Checksums
        run: |
          cd dist/archives
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          files: |
            dist/archives/*
          generate_release_notes: true
          draft: false
          prerelease: false
